############################################################
# WORKSPACE
############################################################
[workspace]
resolver = "3"
members = [
    ".",
    "crates/worker",
    "crates/infra",
    "crates/domain",
    "crates/shared",
]
default-members = ["."]

# Only *inheritable* fields go here (no `name`!)
[workspace.package]
version = "0.5.11"
edition = "2021"

# Shared versions for every crate in the workspace.
# NOTE: `optional = true` is NOT allowed here – it goes in each crate's [dependencies].
[workspace.dependencies]
# internal crates
domain = { path = "crates/domain", package = "question-domain" }
infra  = { path = "crates/infra", package="question-infra" }
shared = { path = "crates/shared", package="quesiton-shared" }

# leptos
leptos        = { version = "0.8.0" }
leptos_router = { version = "0.8.0" }
leptos_meta   = { version = "0.8.0" }
leptos_axum   = { version = "0.8.0" }
leptos_drag_reorder = { version = "0.1.0" }

# server
axum        = { version = "0.8.0", features = ["macros"] }
axum-server = { version = "0.7.2" }
axum-extra  = { version = "0.12.2", features = ["cookie"] }
tokio       = { version = "1", features = ["rt-multi-thread"] }
tower-http  = { version = "0.7.0", features = ["fs", "compression-br", "compression-gzip"] }
config      = { version = "0.15.18" }
sqlx = { version = "0.8.6", default-features = false, features = [
    "runtime-tokio-rustls", "postgres", "macros", "uuid", "chrono", "migrate",
] }

# client
console_error_panic_hook = { version = "0.1" }
wasm-bindgen = { version = "0.2" }
web-sys      = { version = "0.3", features = ["MediaQueryList", "HtmlDocument"] }

# common
icondata    = "0.6.0"
chrono      = "0.4.42"
uuid        = { version = "1.18.1", features = ["v4", "js"] }
validator   = { version = "0.20.0", features = ["derive"] }
serde       = { version = "1.0.228", features = ["derive"] }
secrecy     = { version = "0.10.3", features = ["serde"] }
serde-aux   = "4.7.0"
tracing     = { version = "0.1.41", features = ["log"] }
pwhash      = "1.0.0"
getrandom   = { version = "0.2.16", features = ["js"] }
thiserror   = "2.0.17"
anyhow      = "1.0.100"
time        = "0.3.44"
singlestage = "0.4.1"
pulldown-cmark = "0.13.4"
ratex-svg    = { version ="0.1.11", features = ["embed-fonts"]}
ratex-parser = "0.1.11"
ratex-layout = "0.1.11"
regex = "1.12.4"

############################################################
# ROOT PACKAGE (the Leptos app itself, member ".")
############################################################
[package]
name = "leptos-question-bank"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# internal crates
domain.workspace = true
shared.workspace = true
# infra almost certainly uses sqlx/tokio, which cannot compile to WASM,
# so it must only be pulled in for the server build.
infra = { workspace = true, optional = true }

leptos.workspace = true
leptos_router.workspace = true
leptos_meta.workspace = true
leptos_axum = { workspace = true, optional = true }
leptos_drag_reorder = { workspace = true, optional = true }

axum        = { workspace = true, optional = true }
axum-server = { workspace = true, optional = true }
axum-extra.workspace = true
tokio       = { workspace = true, optional = true }
tower-http  = { workspace = true, optional = true }
config      = { workspace = true, optional = true }
sqlx        = { workspace = true, optional = true }
uuid        = { workspace = true, optional = true }

console_error_panic_hook = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
web-sys.workspace = true

icondata.workspace = true
chrono.workspace = true
validator.workspace = true
serde.workspace = true
secrecy.workspace = true
serde-aux.workspace = true
tracing.workspace = true
pwhash.workspace = true
getrandom.workspace = true
thiserror.workspace = true
anyhow.workspace = true
time.workspace = true
singlestage.workspace = true
pulldown-cmark.workspace = true
ratex-svg.workspace = true
ratex-parser.workspace = true
ratex-layout.workspace = true
regex.workspace = true

[dev-dependencies]
fake = "4.4.0"
leptos_reactive = "0.6.15"   # Leptos 0.6 crate – you are on 0.8, consider removing
proptest = "1.8.0"
rand = "0.9.2"
reqwest = "0.12.24"
tokio = { workspace = true, features = ["macros", "full"] }
wasm-bindgen-test = "0.3"

[features]
hydrate = [
    "leptos/hydrate",
    "dep:console_error_panic_hook",
    "dep:wasm-bindgen",
    "dep:leptos_drag_reorder",
]
ssr = [
    "dep:infra",
    "dep:axum",
    "dep:tokio",
    "dep:leptos_axum",
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
    "dep:sqlx",
    "dep:uuid",
    "dep:axum-server",
    "dep:config",
    "dep:tower-http",
]
test-fullstack = ["ssr", "hydrate"]

############################################################
# PROFILES (must stay in the workspace root)
############################################################
[profile.wasm-release]
inherits = "release"
opt-level = 'z'
lto = true
codegen-units = 1
panic = "abort"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"
strip = true

############################################################
# CARGO-LEPTOS
############################################################
[package.metadata.leptos]
output-name = "leptos-question-bank"
wasm-opt = true
site-root = "target/site"
site-pkg-dir = "pkg"
tailwind-input-file = "style/main.css"
LEPTOS_TAILWIND_VERSION = "v4.1.17"
assets-dir = "public"
site-addr = "127.0.0.1:3000"
reload-port = 3001
end2end-cmd = "npx playwright test"
end2end-dir = "end2end"
browserquery = "defaults"
env = "DEV"
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false
lib-profile-release = "wasm-release"
