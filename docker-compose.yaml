services:
  db:
    image: postgres:17
    container_name: question-bank-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=question_bank
    # Postgres runs every *.sql in here (in filename order) on first boot,
    # which lines up with sqlx's timestamp-prefixed migration filenames.
    volumes:
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d question_bank"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - question-bank-net

  app:
    build: .
    container_name: question-bank
    depends_on:
      db:
        condition: service_healthy
    environment:
      # The image bakes in APP_ENVIRONMENT=production (see Dockerfile), whose
      # config/production.yaml sets require_ssl: true — override it here since
      # this is a plain, non-TLS Postgres container for local build testing.
      - APP_DATABASE__HOST=db
      - APP_DATABASE__PORT=5432
      - APP_DATABASE__DATABASE_NAME=question_bank
      - APP_DATABASE__USERNAME=postgres
      - APP_DATABASE__PASSWORD=password
      - APP_DATABASE__REQUIRE_SSL=false
    restart: always
    networks:
      - question-bank-net
    ports:
      - "8888:3000"

networks:
  question-bank-net:
    name: question-bank-net
    driver: bridge
