name: Build and Push Docker Image

on:
  push:
    tags:
      - 'v*' # Triggers on tags like v0.3.4
  workflow_dispatch: # Allows manual trigger
    inputs:
      version:
        description: 'Image version (e.g., 0.3.4)'
        required: true
        default: 'latest'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:         # Add this section
      contents: read
      packages: write # Needed to push to Gitea's registry
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Clean Registry URL
        id: registry_url
        run: |
          # Removes http:// or https:// from the server_url
          CLEAN_URL=$(echo "${{ gitea.server_url }}" | sed -e 's|^[^/]*//||')
          echo "url=$CLEAN_URL" >> $GITHUB_OUTPUT

      - name: Login to Gitea Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ gitea.server_url }}
          username: ${{ gitea.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }} # Gitea automatically provides this

      - name: Extract Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ gitea.server_url }}/${{ gitea.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.tags}}
            ${{ steps.registry_url.outputs.url }}/${{ gitea.repository }}:${{ github.event.inputs.version || 'latest' }}
          labels: ${{ steps.meta.outputs.labels }}
